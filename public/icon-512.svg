<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0f172a" rx="96"/>
  <!-- Outer compass ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="8"/>
  <!-- Cardinal direction marks -->
  <line x1="256" y1="68" x2="256" y2="100" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="444" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="68" y1="256" x2="100" y2="256" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="444" y2="256" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- VFR green accent ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="20 30" opacity="0.7"/>
  <!-- Airplane - simple triangle style -->
  <polygon points="256,136 306,336 256,296 206,336" fill="#ffffff"/>
  <!-- Wings -->
  <polygon points="256,236 356,286 356,296 256,256" fill="#ffffff"/>
  <polygon points="256,236 156,286 156,296 256,256" fill="#ffffff"/>
  <!-- Tail fins -->
  <polygon points="256,316 286,356 286,366 256,336" fill="#e2e8f0"/>
  <polygon points="256,316 226,356 226,366 256,336" fill="#e2e8f0"/>
</svg>
