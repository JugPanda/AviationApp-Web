<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bgGrad)" rx="36"/>
  <!-- Outer compass ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- Cardinal direction marks -->
  <line x1="96" y1="24" x2="96" y2="36" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="156" x2="96" y2="168" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="96" x2="36" y2="96" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="156" y1="96" x2="168" y2="96" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Airplane silhouette pointing up -->
  <g transform="translate(96, 96) scale(0.375)">
    <!-- Fuselage -->
    <path d="M0,-120 L12,-60 L12,60 L30,100 L30,115 L12,100 L12,120 L25,140 L25,150 L0,135 L-25,150 L-25,140 L-12,120 L-12,100 L-30,115 L-30,100 L-12,60 L-12,-60 Z" fill="url(#planeGrad)"/>
    <!-- Wings -->
    <path d="M12,0 L100,40 L100,55 L12,30 Z" fill="url(#planeGrad)"/>
    <path d="M-12,0 L-100,40 L-100,55 L-12,30 Z" fill="url(#planeGrad)"/>
  </g>
  <!-- VFR green accent ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>
</svg>
