<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#0f172a" rx="36"/>
  <!-- Outer compass ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- Cardinal direction marks -->
  <line x1="96" y1="24" x2="96" y2="38" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="154" x2="96" y2="168" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="96" x2="38" y2="96" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="154" y1="96" x2="168" y2="96" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- VFR green accent ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.7"/>
  <!-- Airplane - simple triangle style -->
  <polygon points="96,51 115,126 96,111 77,126" fill="#ffffff"/>
  <!-- Wings -->
  <polygon points="96,89 134,108 134,111 96,96" fill="#ffffff"/>
  <polygon points="96,89 58,108 58,111 96,96" fill="#ffffff"/>
  <!-- Tail fins -->
  <polygon points="96,119 107,134 107,138 96,126" fill="#e2e8f0"/>
  <polygon points="96,119 85,134 85,138 96,126" fill="#e2e8f0"/>
</svg>
